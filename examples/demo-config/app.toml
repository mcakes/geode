config_version = 1
# No `[modules] default`: the key was retired with the split verbs (spec
# 2026-09-08 add-tile §7.1) — tiles are added by kind (ctrl+k → Add …),
# and `--demo` boots to an empty workspace showing that hint. Leaving it
# here would make Geode's own demo layer warn about itself on every boot.
[blotter]
stale_after = "15m"

# The timeseries viewer's default fetch source (timeseries spec §10):
# `:add SPX.close` reads `SPX.close@demo_kdb`.
[timeseries]
default_source = "demo_kdb"

# The pricer entry bar's underlying suggestions: the demo generator's own
# vocabulary, so `--demo` completes the names its risk and market data use.
[pricing]
underlyings = ["SPX", "SX5E", "NKY", "UKX", "NDX", "RTY", "DAX", "SMI", "HSI", "KOSPI2"]
