config_version = 1
# No `[modules] default`: the key was retired with the split verbs (spec
# 2026-09-08 add-tile §7.1) — tiles are added by kind (ctrl+k → Add …),
# and `--demo` boots to an empty workspace showing that hint. Leaving it
# here would make Geode's own demo layer warn about itself on every boot.
[blotter]
stale_after = "15m"
