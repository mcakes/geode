config_version = 1
# Demo startup opens an empty workspace; tiles are added by kind from
# the palette or tile picker.
[blotter]
stale_after = "15m"

# The default fetch source for series entered without an explicit source:
# `:add SPX.close` reads `SPX.close@demo_kdb`.
[timeseries]
default_source = "demo_kdb"

# The pricer entry bar's underlying suggestions: the demo generator's own
# vocabulary, so `--demo` completes the names its risk and market data use.
[pricing]
underlyings = ["SPX", "SX5E", "NKY", "UKX", "NDX", "RTY", "DAX", "SMI", "HSI", "KOSPI2"]
# A new line's payout currency: the underlying's `currency` in the reference table.
payout_currency = "underlyings.currency"

# The vol watchlist tile: board refresh (min 10s, or "off") and the book vega
# column, read from a configured grouped view joined by underlying.
# Tabs come from vol_views.toml (builtin: vol, skew, varswap, surface).
[volwatch]
refresh = "60s"
vega = { view = "by_underlying", column = "vega01_usd" }
# A row older than this shows its name muted (grid and band); a surface
# publishes once a day, so the default is a day.
# stale_after = "24h"
