# The --demo layer's views. `tree` is the shape the blotter runs and
# the requery benchmarks measure; `wide` is the 100-column view the
# DataTable swap trigger is measured on (spec §6.6).
config_version = 1

[tree]
dataset = "risk_snapshot"
grouping = ["lhu", "underlying_ref", "position_ref"]
[[tree.columns]]
name = "delta01"
label = "Δ01"
[[tree.columns]]
name = "gamma01"
label = "Γ01"
[[tree.columns]]
name = "vega01"
[[tree.columns]]
name = "cross_gamma02"
[[tree.columns]]
name = "npv"
format = { precision = 0, scale = "k" }
[[tree.columns]]
name = "daily_trading_pnl"
format = { precision = 0, negative = "parens" }

[wide]
dataset = "risk_snapshot"
grouping = ["book", "lhu", "position_ref"]
# Every measure and its `_usd` twin (38 columns, expanded mechanically
# from `datasets.toml`'s declared measures), then derived columns
# `d01 = delta01 * 1` through `d62 = delta01 * 62`, for 100 columns —
# the count the DataTable swap trigger is measured against (spec §6.6).
[[wide.columns]]
name = "delta01"

[[wide.columns]]
name = "delta01_usd"

[[wide.columns]]
name = "delta02"

[[wide.columns]]
name = "delta02_usd"

[[wide.columns]]
name = "delta05"

[[wide.columns]]
