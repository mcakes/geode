# `risk_snapshot` (Phase 3 spec §3, §9.1): the blotter's `--demo` layer
# uses this file as-is, and it doubles as the reference `datasets.toml`
# for the desk's own config — every measure `geode-demo-data` emits is
# declared here, at the grain the generator produces it (spec §3.2/§3.3),
# so `SUM` never double-counts a coarser-grain measure repeated across
# finer rows.
#
# `source_name` is the CSV header spelling; the bare key is the canonical
# name everything else (views, dimensions, groupings) uses. The `_usd`
# twins are the FX-converted columns the generator emits alongside their
# base measure (`crates/geode-demo-data/src/emit.rs`'s `USD_TWINS`) —
# read that file if this list and the generator's output ever disagree.
#
# **If you change the columns below, delete the demo/probe database
# first.** `apply_schema` is CREATE TABLE IF NOT EXISTS, so an existing
# table is never migrated; a schema that has grown a column then fails
# every publish with "table ... has N columns but N+1 values were
# supplied". `--demo`'s database lives at
# `$TMPDIR/geode-demo/<rows>-<seed>/geode.duckdb` (`geode-app::demo::demo_dir`,
# seed fixed at 42) — delete that whole `<rows>-<seed>` directory, since
# the generated source CSVs under its `src/` are keyed to the same schema.

[risk_snapshot.columns.business_date]
type = "utf8"
role = "attribute"
grain = "position"
source_name = "BusinessDate"

[risk_snapshot.columns.book]
type = "utf8"
role = "dimension"
textual = true
source_name = "Book"

[risk_snapshot.columns.lhu]
type = "utf8"
role = "dimension"
textual = true
source_name = "LHU"

[risk_snapshot.columns.position_ref]
type = "utf8"
role = "key"
textual = true
source_name = "PositionRef"

[risk_snapshot.columns.instrument_ref]
type = "utf8"
role = "key"
textual = true
source_name = "InstrumentRef"

[risk_snapshot.columns.underlying_ref]
type = "utf8"
role = "dimension"
textual = true
source_name = "Underlying1Ref"

[risk_snapshot.columns.underlying2_ref]
type = "utf8"
role = "dimension"
source_name = "Underlying2Ref"

[risk_snapshot.columns.counterparty]
type = "utf8"
role = "dimension"
textual = true
source_name = "Counterparty"

# Instrument reference data a desk groups by. A numeric dimension: carried
# by the instrument grain like `currency` below, so a slot or view may group
# by it, but never categorical (only a utf8 column can be an ENUM) and so
# never in the dimension picker — the Groupings dialog offers it, `mod+p`
# does not.
[risk_snapshot.columns.strike]
type = "f64"
role = "dimension"
grain = "instrument"
source_name = "Strike"

# Carried dimensions (spec §3.3): one value per instrument, carried by the
# instrument grain and every finer one, groupable and scopeable like a key
# dimension rather than a lookup-only attribute.
[risk_snapshot.columns.expiry]
type = "utf8"
role = "dimension"
grain = "instrument"
textual = true
source_name = "Expiry"

[risk_snapshot.columns.currency]
