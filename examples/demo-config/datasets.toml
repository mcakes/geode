# `risk_snapshot` (Phase 3 spec §3, §9.1): the blotter's `--demo` layer
# uses this file as-is, and it doubles as the reference `datasets.toml`
# for the desk's own config — every measure `geode-demo-data` emits is
# declared here, at the grain the generator produces it (spec §3.2/§3.3),
# so `SUM` never double-counts a coarser-grain measure repeated across
# finer rows.
#
# `source_name` is the CSV header spelling; the bare key is the canonical
# name everything else (views, dimensions, groupings) uses. The `_usd`
# twins are the FX-converted columns the generator emits alongside their
# base measure (`crates/geode-demo-data/src/emit.rs`'s `USD_TWINS`) —
# read that file if this list and the generator's output ever disagree.
#
# **If you change the columns below, delete the demo/probe database
# first.** `apply_schema` is CREATE TABLE IF NOT EXISTS, so an existing
# table is never migrated; a schema that has grown a column then fails
# every publish with "table ... has N columns but N+1 values were
# supplied".

[risk_snapshot.columns.business_date]
type = "utf8"
role = "attribute"
grain = "position"
source_name = "BusinessDate"

[risk_snapshot.columns.book]
type = "utf8"
role = "dimension"
source_name = "Book"

[risk_snapshot.columns.lhu]
