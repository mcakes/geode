# Demo risk, document, and series datasets. Risk measures declare the grain
# at which the generator assigns them, so repeated coarse values are
# deduplicated before aggregation.
#
# `source_name` maps CSV headers to canonical names used by views, scopes,
# and groupings. USD twins match `geode-demo-data/src/emit.rs::USD_TWINS`;
# the generator applies a fixed factor of 1.08 to their base measures.
#
# Stored payload tables are not automatically migrated. After changing this
# schema, clear `$TMPDIR/geode-demo/<rows>-42/` before restarting `--demo`.
# This removes both the database and the source CSVs tied to its schema.

[risk_snapshot.columns.business_date]
type = "utf8"
role = "attribute"
grain = "position"
source_name = "BusinessDate"

[risk_snapshot.columns.book]
type = "utf8"
role = "dimension"
textual = true
source_name = "Book"

[risk_snapshot.columns.lhu]
type = "utf8"
role = "dimension"
textual = true
source_name = "LHU"

[risk_snapshot.columns.position_ref]
type = "utf8"
role = "key"
textual = true
source_name = "PositionRef"

[risk_snapshot.columns.instrument_ref]
type = "utf8"
role = "key"
textual = true
source_name = "InstrumentRef"

[risk_snapshot.columns.underlying_ref]
type = "utf8"
role = "dimension"
textual = true
source_name = "Underlying1Ref"

[risk_snapshot.columns.underlying2_ref]
type = "utf8"
role = "dimension"
source_name = "Underlying2Ref"

[risk_snapshot.columns.counterparty]
type = "utf8"
role = "dimension"
textual = true
source_name = "Counterparty"

# Instrument reference data a desk groups by. A numeric dimension: carried
# by the instrument grain like `currency` below, so a slot or view may group
# by it, but never categorical (only a utf8 column can be an ENUM) and so
# never in the dimension picker — the Groupings dialog offers it, `mod+p`
# does not.
[risk_snapshot.columns.strike]
type = "f64"
role = "dimension"
grain = "instrument"
source_name = "Strike"

# Carried dimensions: one value per instrument, carried by the
# instrument grain and every finer one, groupable and scopeable like a key
# dimension rather than a lookup-only attribute.
[risk_snapshot.columns.expiry]
type = "utf8"
role = "dimension"
grain = "instrument"
textual = true
source_name = "Expiry"

[risk_snapshot.columns.currency]
type = "utf8"
role = "dimension"
grain = "instrument"
textual = true
source_name = "Currency"

[risk_snapshot.columns.model_code]
type = "utf8"
role = "dimension"
grain = "instrument"
textual = true
source_name = "ModelCode"

