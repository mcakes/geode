# ---- Market-data documents (2026-09-12 design). ----
# Declared in Part 1; Part 2's demo bus (`geode-app::demo_bus`, fed
# through the `[cvi]` source `demo.rs::layer` generates over the
# `demo_bus` `ChannelAdapter`) feeds it now, so `--demo` publishes CVI
# documents into this table rather than leaving it empty.

[cvi_params]
family = "document"
key = ["underlying_ref"]          # one document per key value
axes = ["term", "node"]           # ordered; identify a row within a document

[cvi_params.columns.underlying_ref]
type = "utf8"
role = "dimension"
textual = true
[cvi_params.columns.term]
type = "date"
role = "axis"
[cvi_params.columns.node]
type = "f64"
role = "axis"
[cvi_params.columns.param]
type = "f64"
role = "value"
[cvi_params.columns.forward]
type = "f64"
role = "value"                    # per slice: constant across a term's nodes; the CVI kind refuses a document where it is not
[cvi_params.columns.atm]
type = "f64"
role = "value"                    # per slice: constant across a term's nodes; the CVI kind refuses a document where it is not
[cvi_params.columns.skew]
type = "f64"
role = "value"                    # per slice: constant across a term's nodes; the CVI kind refuses a document where it is not
[cvi_params.columns.anchor_date]
type = "date"
role = "attribute"                # document-level: constant within one document
[cvi_params.columns.spot_ref]
type = "f64"
role = "attribute"
