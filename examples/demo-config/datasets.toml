# ---- CVI parameter documents. ----
# geode-app::demo_bus publishes through the generated `[cvi]` source and
# the demo_bus channel adapter. Each key replaces one complete document.

[cvi_params]
family = "document"
key = ["underlying_ref"]          # one document per key value
axes = ["term", "node"]           # ordered; identify a row within a document

[cvi_params.columns.underlying_ref]
type = "utf8"
role = "dimension"
textual = true
[cvi_params.columns.term]
type = "date"
role = "axis"
[cvi_params.columns.node]
type = "f64"
role = "axis"
[cvi_params.columns.param]
type = "f64"
role = "value"
[cvi_params.columns.forward]
type = "f64"
role = "value"                    # per slice: constant across a term's nodes; the CVI kind refuses a document where it is not
[cvi_params.columns.atm]
type = "f64"
role = "value"                    # per slice: constant across a term's nodes; the CVI kind refuses a document where it is not
[cvi_params.columns.skew]
type = "f64"
role = "value"                    # per slice: constant across a term's nodes; the CVI kind refuses a document where it is not
[cvi_params.columns.anchor_date]
type = "date"
role = "attribute"                # document-level: constant within one document
[cvi_params.columns.spot_ref]
type = "f64"
role = "attribute"

# ---- Dividend schedules. ----
# The demo bus publishes through the generated `[dividend]` source,
# alternating CVI and dividend updates.

[dividend_schedule]
family = "document"
key = ["underlying_ref"]          # one document per key value
axes = ["dividend_id"]            # identifies a row within a document

[dividend_schedule.columns.underlying_ref]
type = "utf8"
role = "dimension"
textual = true
[dividend_schedule.columns.dividend_id]
type = "utf8"
role = "axis"
[dividend_schedule.columns.ex_date]
type = "date"
role = "value"
[dividend_schedule.columns.announced_date]
type = "date"
role = "value"
[dividend_schedule.columns.pay_date]
type = "date"
role = "value"
[dividend_schedule.columns.amount]
type = "f64"
role = "value"
[dividend_schedule.columns.status]
type = "utf8"
role = "value"                    # one of DividendKind::STATUSES
[dividend_schedule.columns.currency]
type = "utf8"
role = "attribute"                # document-level: constant within one document
[dividend_schedule.columns.schedule_date]
type = "date"
role = "attribute"

# ---- Option chains. ----
# One document per (underlying, expiry): the demo bus publishes one expiry
# of one underlying per cadence tick through the generated `[opra_sim]`
# source. Vols arrive computed; nothing averages bid and ask.
[option_chain]
family = "document"
key = ["underlying_ref", "expiry"]   # expiry is text YYYY-MM-DD: document keys are utf8
axes = ["strike"]

[option_chain.columns.underlying_ref]
type = "utf8"
role = "dimension"
textual = true
[option_chain.columns.expiry]
type = "utf8"
role = "dimension"
[option_chain.columns.strike]
type = "f64"
role = "axis"
[option_chain.columns.bid_vol]
type = "f64"
role = "value"
[option_chain.columns.ask_vol]
type = "f64"
role = "value"
[option_chain.columns.mid_vol]
type = "f64"
role = "value"
[option_chain.columns.bid]
type = "f64"
role = "value"
[option_chain.columns.ask]
type = "f64"
role = "value"
[option_chain.columns.forward]
type = "f64"
role = "attribute"
[option_chain.columns.spot_ref]
type = "f64"
role = "attribute"
[option_chain.columns.quote_time]
type = "utf8"
role = "attribute"                # RFC 3339 text: document columns cannot be timestamps

# Series fetch sources share this cache, keyed by identity and source.
# The series family defines the columns.
[series]
family = "series"
retention = "7d"
