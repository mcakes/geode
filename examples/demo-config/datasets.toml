axes = ["dividend_id"]            # identifies a row within a document

[dividend_schedule.columns.underlying_ref]
type = "utf8"
role = "dimension"
textual = true
[dividend_schedule.columns.dividend_id]
type = "utf8"
role = "axis"
[dividend_schedule.columns.ex_date]
type = "date"
role = "value"
[dividend_schedule.columns.announced_date]
type = "date"
role = "value"
[dividend_schedule.columns.pay_date]
type = "date"
role = "value"
[dividend_schedule.columns.amount]
type = "f64"
role = "value"
[dividend_schedule.columns.status]
type = "utf8"
role = "value"                    # one of DividendKind::STATUSES
[dividend_schedule.columns.currency]
type = "utf8"
role = "attribute"                # document-level: constant within one document
[dividend_schedule.columns.schedule_date]
type = "date"
role = "attribute"

# ---- Option chains. ----
# One document per (underlying, expiry): the demo bus publishes one expiry
# of one underlying per cadence tick through the generated `[opra_sim]`
# source. Vols arrive computed; nothing averages bid and ask.
[option_chain]
family = "document"
key = ["underlying_ref", "expiry"]   # expiry is text YYYY-MM-DD: document keys are utf8
axes = ["strike"]

[option_chain.columns.underlying_ref]
type = "utf8"
role = "dimension"
textual = true
[option_chain.columns.expiry]
type = "utf8"
role = "dimension"
[option_chain.columns.strike]
type = "f64"
role = "axis"
[option_chain.columns.bid_vol]
type = "f64"
role = "value"
[option_chain.columns.ask_vol]
type = "f64"
role = "value"
[option_chain.columns.mid_vol]
type = "f64"
role = "value"
[option_chain.columns.bid]
type = "f64"
role = "value"
[option_chain.columns.ask]
type = "f64"
role = "value"
[option_chain.columns.forward]
type = "f64"
role = "attribute"
[option_chain.columns.spot_ref]
type = "f64"
role = "attribute"
[option_chain.columns.quote_time]
type = "utf8"
role = "attribute"                # RFC 3339 text: document columns cannot be timestamps

# Series fetch sources share this cache, keyed by identity and source.
# The series family defines the columns.
[series]
family = "series"
retention = "7d"

# ---- Underlying reference data. ----
# One row per underlying: system ticker to vendor tickers and static
# attributes. `geode_compose::demo_refdb` serves it through the generated
# `[refdb]` snapshot source; every third poll revises one name.
[underlyings]
family = "reference"
key = ["underlying_ref"]

[underlyings.columns.underlying_ref]
type = "utf8"
role = "dimension"
textual = true
[underlyings.columns.name]
type = "utf8"
role = "attribute"
[underlyings.columns.bbg_ticker]
type = "utf8"
role = "attribute"
[underlyings.columns.ric]
type = "utf8"
role = "attribute"
[underlyings.columns.currency]
type = "utf8"
role = "attribute"
[underlyings.columns.calendar]
type = "utf8"
role = "attribute"                # trading calendar code (ISO 10383 MIC)
[underlyings.columns.exchange]
type = "utf8"
role = "attribute"                # listed-derivatives exchange MIC
[underlyings.columns.asset_type]
type = "utf8"
role = "attribute"
[underlyings.columns.multiplier]
type = "f64"
role = "attribute"                # listed contract multiplier
