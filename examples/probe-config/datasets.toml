# Sample dataset declaration for the throwaway data probe (spec §7).
#
# Matches the columns `geode-demo-data`'s `emit` example writes, so the
# probe can be run end to end without hand-writing a schema:
#
#   cargo run -p geode-demo-data --example emit -- /tmp/geode-probe 100000
#   GEODE_PROBE_DIR=/tmp/geode-probe \
#   GEODE_DESK_CONFIG=examples/probe-config \
#   cargo run -p geode-app
#
# Then toggle the probe with mod+shift+d (mod is alt unless `keymap.mod`
# says otherwise), or "Toggle data probe" in the command palette.
#
# This goes away with the probe in phase 3 — `[sources]` has no real
# config surface yet, which is why the source directory is an environment
# variable rather than a key here.
#
# **If you change the columns below, delete the probe's database first.**
# It lives at `$TMPDIR/geode-probe.duckdb` (on macOS that is under
# /var/folders/..., not /tmp), and `apply_schema` is CREATE TABLE IF NOT
# EXISTS, so an existing table is never migrated. A schema that has grown
# a column then fails every publish with "table ... has N columns but N+1
# values were supplied", and the tile keeps showing rows from the old
# data — a failure that reads like an ingest bug and is not one.
#
# `source_name` is the CSV header spelling; the bare key is the canonical
# name everything else uses. `grain` on a measure is what stops SUM
# double-counting (spec §3.3): a position-grain measure repeated on four
# underlying rows must not be added four times.

[risk_snapshot.columns.business_date]
type = "utf8"
role = "attribute"
grain = "position"
source_name = "BusinessDate"

[risk_snapshot.columns.book]
type = "utf8"
role = "dimension"
source_name = "Book"

[risk_snapshot.columns.lhu]
type = "utf8"
role = "dimension"
source_name = "LHU"

[risk_snapshot.columns.position_ref]
type = "utf8"
role = "key"
source_name = "PositionRef"

[risk_snapshot.columns.instrument_ref]
type = "utf8"
role = "key"
source_name = "InstrumentRef"

[risk_snapshot.columns.underlying_ref]
type = "utf8"
role = "dimension"
source_name = "Underlying1Ref"

[risk_snapshot.columns.underlying2_ref]
type = "utf8"
role = "dimension"
source_name = "Underlying2Ref"

[risk_snapshot.columns.counterparty]
type = "utf8"
role = "dimension"
source_name = "Counterparty"

[risk_snapshot.columns.model_code]
type = "utf8"
role = "attribute"
grain = "instrument"
source_name = "ModelCode"

# Underlying grain: one row per (position, underlying).
[risk_snapshot.columns.delta01]
type = "f64"
role = "measure"
grain = "underlying"
source_name = "Delta01"

[risk_snapshot.columns.gamma01]
type = "f64"
role = "measure"
grain = "underlying"
source_name = "Gamma01"

[risk_snapshot.columns.vega01]
type = "f64"
role = "measure"
grain = "underlying"
source_name = "Vega01"

# Pair grain. Cross gamma belongs to a *pair* of underlyings, so at an
# underlying-level grouping it is NonAttributable (spec §6.3) and the
# compiler blanks it. That blank is the thing worth looking at in the
# probe: it must render empty, not 0.00.
[risk_snapshot.columns.cross_gamma02]
type = "f64"
role = "measure"
grain = "underlying_pair"
source_name = "CrossGamma02"

# Instrument grain.
[risk_snapshot.columns.npv]
type = "f64"
role = "measure"
grain = "instrument"
source_name = "NPV"

# Position grain.
[risk_snapshot.columns.daily_trading_pnl]
type = "f64"
role = "measure"
grain = "position"
source_name = "DailyTradingPNL"
