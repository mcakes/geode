name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # geode-data builds DuckDB from C++ source (duckdb's `bundled` feature):
    # measured 127s wall / 1382s CPU on an M-series Mac, so a cold cache on
    # a smaller runner needs real headroom. Swatinem/rust-cache below keeps
    # the libduckdb-sys artifacts between runs; this covers the cold case.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Benches compile
        run: cargo bench --workspace --no-run
