[package]
name = "geode-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Fixture builders for downstream tests. `Snapshot::for_tests` accepts plain
# Rust values so fixtures need no Arrow dependency. `config::test_support::
# config_from` builds a real Config from one builtin document without disk I/O.
# `reference::test_support::reference_dataset` is a parsed reference DatasetSpec.
test-support = []

[dependencies]
# Preserve schema declaration order for columns, pickers, and categorical lists.
# Cargo unifies this feature for consumers of the same TOML package, including
# geode-shell and geode-app. Consumers requiring a different order must sort
# explicitly; keymap alias tie-breaking sorts by spelling.
toml = { version = "1.1.4", features = ["preserve_order"] }
# Must match the version duckdb-rs re-exports, or `RecordBatch` here and
# `RecordBatch` there are different types. Check with
# `cargo tree -p geode-data -i arrow` before bumping.
arrow = "58.4.0"
chrono = "0.4.42"
# IANA zone data for the configured display clock. Other crates use `clock::Clock`
# without depending on chrono-tz or naming its `Tz` type.
chrono-tz = "0.10"
# Look up the machine's IANA zone name for `Clock::machine`. Display code uses
# Clock rather than chrono's machine-local clock; a source scan enforces this.
iana-time-zone = "0.1"
# Compile and apply source filename `batch_pattern` expressions in source_config.
regex = "1.11.1"
# `scopes::scope_to_table` writes the TOML table `persist_scope_to_user_config`
# (geode-shell) merges into the user layer's `scopes.toml` — `toml_edit`
# rather than `toml`, matching every other read-modify-write config writer
# in this codebase (see `geode-shell`'s own `toml_edit` dependency comment).
toml_edit = "0.25.13"
# `geode_core::log`: the ring's `Record`/`Level` and the `RingLayer`
# subscriber layer that feeds it.
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
criterion = "0.8.2"
# Enables `test-support` for this crate's own benches (cargo permits a
# self dev-dependency for exactly this), so `Snapshot::for_tests` is
# available to `benches/tree.rs` under the plain `cargo bench --workspace
# --no-run` CI runs.
geode-core = { path = ".", features = ["test-support"] }

[[bench]]
name = "tree"
harness = false

[[bench]]
name = "config_merge"
harness = false

[[bench]]
name = "scope"
harness = false
