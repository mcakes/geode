[package]
name = "geode-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Fixture builders for downstream crates' tests (`Snapshot::for_tests`).
# Exists so that Arrow stays an implementation detail of `snapshot.rs`:
# without it, every crate that wants a `Snapshot` fixture would have to
# name Arrow types, which is exactly what that module promises nobody
# outside it does.
test-support = []

[dependencies]
# `preserve_order`: a dataset's declared columns keep the schema's
# declaration order (spec §3.3's `categorical_columns`/`dimensions_at`
# read that order — a picker or interned-ENUM list in TOML order is what
# a trader expects, not an alphabetical shuffle). `indexmap` is already
# in the dependency graph (via `arrow-json`), so this adds no new crate.
toml = { version = "1.1.4", features = ["preserve_order"] }
# Must match the version duckdb-rs re-exports, or `RecordBatch` here and
# `RecordBatch` there are different types. Check with
# `cargo tree -p geode-data -i arrow` before bumping.
arrow = "58.4.0"
chrono = "0.4.42"

[dev-dependencies]
tempfile = "3.27.0"
criterion = "0.8.2"
# Enables `test-support` for this crate's own benches (cargo permits a
# self dev-dependency for exactly this), so `Snapshot::for_tests` is
# available to `benches/tree.rs` under the plain `cargo bench --workspace
# --no-run` CI runs.
geode-core = { path = ".", features = ["test-support"] }

[[bench]]
name = "tree"
harness = false
