[package]
name = "geode-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Fixture builders for downstream crates' tests (`Snapshot::for_tests`).
# Exists so that Arrow stays an implementation detail of `snapshot.rs`:
# without it, every crate that wants a `Snapshot` fixture would have to
# name Arrow types, which is exactly what that module promises nobody
# outside it does.
test-support = []

[dependencies]
# `preserve_order`: a dataset's declared columns keep the schema's
# declaration order (spec §3.3's `categorical_columns`/`dimensions_at`
# read that order — a picker or interned-ENUM list in TOML order is what
# a trader expects, not an alphabetical shuffle). `indexmap` is already
# in the dependency graph (via `arrow-json`), so this adds no new crate.
#
# This feature is workspace-wide, not geode-core-local: Cargo unifies
# features across every crate that resolves to the same `toml` version
# (confirmed with `cargo tree -e features -i toml@1.1.4`, geode-core's
# fix report), so `geode-shell` and `geode-app`'s own `toml::Table`s are
# also IndexMaps in file order now, not BTreeMaps in sorted order. Kept
# on anyway (the schema behaviour above is worth it) — every consumer of
# a `toml::Table`/`toml::Value::Table` in `geode-shell`/`geode-app`/
# `geode-core::config` was audited for order-dependence; the one real
# case (`keymap::build`'s ambiguous-alias tie-break) now sorts by
# spelling explicitly instead of relying on the table's own iteration
# order. See the fix report for the full audit.
toml = { version = "1.1.4", features = ["preserve_order"] }
# Must match the version duckdb-rs re-exports, or `RecordBatch` here and
# `RecordBatch` there are different types. Check with
# `cargo tree -p geode-data -i arrow` before bumping.
arrow = "58.4.0"
chrono = "0.4.42"
# `source_config::SourceSpec::batch_of`/`from_doc` compile and apply the
# user-supplied `batch_pattern` (spec §4.3). Same version geode-data used
# before this reader moved here (Phase 4c §2.2).
regex = "1.11.1"
# `scopes::scope_to_table` writes the TOML table `persist_scope_to_user_config`
# (geode-shell) merges into the user layer's `scopes.toml` — `toml_edit`
# rather than `toml`, matching every other read-modify-write config writer
# in this codebase (see `geode-shell`'s own `toml_edit` dependency comment).
toml_edit = "0.25.13"

[dev-dependencies]
tempfile = "3.27.0"
criterion = "0.8.2"
# Enables `test-support` for this crate's own benches (cargo permits a
# self dev-dependency for exactly this), so `Snapshot::for_tests` is
# available to `benches/tree.rs` under the plain `cargo bench --workspace
# --no-run` CI runs.
geode-core = { path = ".", features = ["test-support"] }

[[bench]]
name = "tree"
harness = false

[[bench]]
name = "config_merge"
harness = false
