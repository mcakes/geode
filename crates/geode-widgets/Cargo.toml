[package]
name = "geode-widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

# Reusable widget state and host-styled GPUI painters. Shell and feature crates
# share these controls without depending on one another.
[dependencies]
# Shared application vocabulary comes from core, never from a widget's host.
geode-core.workspace = true
gpui.workspace = true
gpui-component.workspace = true
chrono = "0.4.42"

[dev-dependencies]
# Match the workspace test features so crate-local tests share its dependency graph.
geode-core = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
