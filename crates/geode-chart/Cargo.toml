[package]
name = "geode-chart"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

# Runtime dependencies provide colour contrast, chart painting and calendar
# boundaries. Source identities, data access and shell state stay with the
# caller; the rem scale arrives as a parameter.
[dependencies]
geode-core.workspace = true
gpui.workspace = true
gpui-component.workspace = true
chrono = "0.4.42"

# Shell test support supplies bundled themes for the palette contrast sweep.
# `gpui_platform` provides the example window's entry point.
[dev-dependencies]
geode-core = { workspace = true, features = ["test-support"] }
geode-shell = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
criterion = "0.8.2"
proptest = "1"

[[bench]]
name = "decimate"
harness = false

# Exclude the examples from the built-in benchmark harness.
[[example]]
name = "chart"
bench = false

[[example]]
name = "xy"
bench = false
