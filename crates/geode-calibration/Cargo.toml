[package]
name = "geode-calibration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

# Shared vocabulary (the pipeline document, link groups, calibration
# requests and outcomes) lives in geode-core; geode-shell supplies hosting,
# geode-tile the shared header and notices, and DataHandle is the module's
# interface to geode-data.
[dependencies]
# The instant an upload landed (`Utc::now`); every displayed time still
# goes through `geode_core::clock::Clock`.
chrono = "0.4.42"
geode-core.workspace = true
geode-shell.workspace = true
geode-tile.workspace = true
geode-data = { path = "../geode-data" }
gpui.workspace = true
gpui-component.workspace = true
toml = "1.1.4"

[dev-dependencies]
geode-core = { workspace = true, features = ["test-support"] }
geode-shell = { workspace = true, features = ["test-support"] }
geode-data = { path = "../geode-data", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
