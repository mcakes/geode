[package]
name = "geode-data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
test-support = []

[dependencies]
geode-core.workspace = true
chrono = "0.4.42"
# Build DuckDB from bundled C++ sources without requiring a system install.
# The chrono feature enables timestamp conversions at the SQL boundary.
duckdb = { version = "1.10505.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
glob = "0.3.3"
# Emit publication, health, polling, and worker diagnostics.
tracing.workspace = true

[dev-dependencies]
# Match the test-support feature used by downstream consumers so crate-only
# and workspace tests share the same geode-data feature configuration.
geode-data = { path = ".", features = ["test-support"] }
# Use geode-core's fixture API and match its workspace-test features.
geode-core = { workspace = true, features = ["test-support"] }
criterion = "0.8.2"
geode-demo-data = { path = "../geode-demo-data" }
tempfile = "3.27.0"
proptest = "1"
# Capture emitted log levels through a scoped subscriber in health tests.
tracing-subscriber.workspace = true

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "publish_document"
harness = false

[[bench]]
name = "append_series"
harness = false

[[bench]]
name = "series_query"
harness = false
