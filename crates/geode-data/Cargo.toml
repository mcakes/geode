[package]
name = "geode-data"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
test-support = []

[dependencies]
geode-core.workspace = true
chrono = "0.4.42"
# `bundled` compiles DuckDB from C++ source: a multi-minute first build,
# cached thereafter, but with no system-install dependency (spec §9.4).
# `chrono` because duckdb-rs has ToSql/FromSql impls for chrono only.
duckdb = { version = "1.10505.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
glob = "0.3.3"
# Phase 4b Task 2: publish/health/poll events emit through this rather
# than the crate staying silent (it had no `eprintln!` before this task).
tracing.workspace = true

[dev-dependencies]
# Test-feature parity (2026-09-19): same reasoning as geode-shell's self
# dev-dependency — geode-app's and the modules' dev-dependencies enable
# this crate's `test-support`, so `-p geode-data` and `--workspace` must
# resolve the same geode-data.
geode-data = { path = ".", features = ["test-support"] }
# Test-feature parity (2026-09-19): `cargo test --workspace` resolves
# geode-core WITH `test-support` (geode-shell's dev-dependencies turn it
# on, and cargo unifies features across every member it builds together),
# so a `cargo test -p` of this crate alone must ask for the same thing or
# it builds a second geode-core — and everything above it — that differs
# only in that feature. One artifact per crate per profile is the rule;
# `cargo tree -p <member> -i geode-core --format '{p} [{f}]'` must agree
# with `cargo tree --workspace` for every member.
geode-core = { workspace = true, features = ["test-support"] }
criterion = "0.8.2"
geode-demo-data = { path = "../geode-demo-data" }
tempfile = "3.27.0"
proptest = "1"
# Phase 4b Task 2 fix round 1 (MAJ-1): a scoped `tracing_subscriber::
# registry().with(RingLayer::new(...))` default dispatcher is how
# `log_health_event`'s test proves what level actually lands in the ring
# — geode-core's own `Ring`/`RingLayer` are ordinary (non-test-support)
# public items, so only the subscriber machinery itself is dev-only here.
tracing-subscriber.workspace = true

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "publish_document"
harness = false

[[bench]]
name = "append_series"
harness = false
