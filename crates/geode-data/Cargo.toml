[package]
name = "geode-data"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
test-support = []

[dependencies]
geode-core.workspace = true
chrono = "0.4.42"
# `bundled` compiles DuckDB from C++ source: a multi-minute first build,
# cached thereafter, but with no system-install dependency (spec §9.4).
# `chrono` because duckdb-rs has ToSql/FromSql impls for chrono only.
duckdb = { version = "1.10505.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
glob = "0.3.3"
regex = "1.11.1"

[dev-dependencies]
criterion = "0.8.2"
geode-demo-data = { path = "../geode-demo-data" }
tempfile = "3.27.0"
proptest = "1"

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "query"
harness = false
