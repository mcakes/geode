[package]
name = "geode-timeseries"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

# Shared series vocabulary lives in geode-core; geode-shell supplies hosting
# and settings, geode-tile the menus, popups and the notice line. Widgets
# provide date inputs, geode-chart owns chart painting, and DataHandle is the
# module's interface to geode-data.
[dependencies]
geode-core.workspace = true
geode-shell.workspace = true
geode-tile.workspace = true
geode-widgets.workspace = true
geode-chart.workspace = true
geode-data = { path = "../geode-data" }
gpui.workspace = true
gpui-component.workspace = true
chrono = "0.4.42"
toml = "1.1.4"

[dev-dependencies]
geode-core = { workspace = true, features = ["test-support"] }
geode-shell = { workspace = true, features = ["test-support"] }
geode-data = { path = "../geode-data", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
criterion = "0.8.2"
proptest = "1"

[[bench]]
name = "chart_model"
harness = false
