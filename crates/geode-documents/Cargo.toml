[package]
name = "geode-documents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
geode-core.workspace = true
chrono = "0.4.42"
# Parse and write UTF-8 XML with an explicit event walk. The optional
# encoding and serialization features are not needed.
quick-xml = "0.41"

[dev-dependencies]
# Match workspace test features so package-only tests reuse core artifacts.
geode-core = { workspace = true, features = ["test-support"] }
criterion = "0.8.2"
proptest = "1"

[[bench]]
name = "cvi"
harness = false

[[bench]]
name = "dividend"
harness = false
