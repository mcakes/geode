[package]
name = "geode-volwatch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

# The vol watchlist tile: a watchlist's members as rows of a vol board.
# Shared vocabulary (the board, its measures) lives in geode-core;
# geode-shell supplies hosting, geode-tile the header, menus and notices,
# geode-widgets and geode-chart the cell glyphs, and DataHandle is the
# module's interface to geode-data.
[dependencies]
geode-core.workspace = true
geode-shell.workspace = true
geode-tile.workspace = true
geode-data.workspace = true
geode-widgets.workspace = true
geode-chart.workspace = true
gpui.workspace = true
gpui-component.workspace = true
chrono = "0.4.42"
toml = "1.1.4"

[dev-dependencies]
geode-core = { workspace = true, features = ["test-support"] }
geode-shell = { workspace = true, features = ["test-support"] }
geode-data = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
criterion = "0.8.2"

[[bench]]
name = "prepare"
harness = false
