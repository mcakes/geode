[package]
name = "geode-diagnostics"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

# Diagnostics reads shell-owned state and submits no data requests.
# Keep geode-data out of both normal and development dependencies.
# geode-tile supplies the flip-barrier arrival (following::arrive_immediately).
[dependencies]
geode-core.workspace = true
geode-shell.workspace = true
geode-tile.workspace = true
gpui.workspace = true
gpui-component.workspace = true
chrono = "0.4.42"
toml = "1.1.4"
tracing.workspace = true

[dev-dependencies]
geode-core = { workspace = true, features = ["test-support"] }
geode-shell = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
