[package]
name = "geode-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "geode"
path = "src/main.rs"
bench = false

[features]
# Profiler support (spec §7.4), off by default — turns on geode-shell's
# same-named feature (which is gpui's own `profiler` feature; see that
# Cargo.toml's comment). Build with `cargo run -p geode-app --features
# profiling`; verified by `cargo check -p geode-app --features profiling`.
profiling = ["geode-shell/profiling"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
geode-shell = { path = "../geode-shell" }
geode-core.workspace = true
# The data bridge (spec §5.1, src/bridge.rs) is the one place the shell
# and the data layer meet — it replaced the throwaway probe deleted in
# Phase 3c.
geode-data = { path = "../geode-data" }
geode-blotter = { path = "../geode-blotter" }
geode-demo-data = { path = "../geode-demo-data" }
# The bridge's event channel (spec §5.1): bounded, `try_send`-only, and
# awaited on the foreground executor so the drain task wakes on arrival
# rather than polling.
async-channel = "2.5"
# The roster's restored-tile state is opaque `toml::Table` (the module
# hosting contract, geode-shell::module) — `BlotterFactoryHandle::create`
# forwards it verbatim.
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"
# `#[gpui::test]` / `TestAppContext` / `VisualTestContext` for the bridge's
# window-close drain-task test (`src/bridge.rs`), and `DataHandle::
# for_tests()` for a service-thread-free handle — same pattern as
# `geode-blotter`'s dev-dependencies re-declaring the same crates with
# `test-support` turned on.
gpui = { workspace = true, features = ["test-support"] }
geode-data = { path = "../geode-data", features = ["test-support"] }
