[package]
name = "geode-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "geode"
path = "src/main.rs"
bench = false

[features]
# Enable the shell's GPUI profiler integration. Off by default.
profiling = ["geode-shell/profiling"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
# Sibling pins — see the root Cargo.toml's dependency comment: gpui-component
# names these with a caret, and a direct `=` here is what keeps the family
# in step under `cargo update`. Not imported by this crate.
gpui-base.workspace = true
gpui-component-macros.workspace = true
geode-shell = { path = "../geode-shell" }
geode-core.workspace = true
# Store and config path resolution, shared with the background collector.
geode-compose.workspace = true
# The app bridge connects shell state to data services without a dependency
# between those crates.
geode-data = { path = "../geode-data" }
# Register the mock implementation in the shared pricing registry at startup.
geode-pricing.workspace = true
geode-blotter = { path = "../geode-blotter" }
# Market-data factories share the bridge's DataHandle for document requests.
geode-marketdata = { path = "../geode-marketdata" }
# The bridge owns the series factory's data handle and config reload routing.
geode-timeseries.workspace = true
# The vol slice viewer's factory shares the bridge's DataHandle.
geode-volslice.workspace = true
geode-classifications.workspace = true
# The watchlist factory takes the bridge's config snapshot and refresh hook.
geode-watchlist.workspace = true
# The bridge routes pricing and local-sheet outcomes to this factory.
geode-pricer.workspace = true
# Row menu actions registered at the composition root: Open in Nemo.
geode-nemo.workspace = true
# Row menu actions registered at the composition root: Move LHU.
geode-positions.workspace = true
geode-diagnostics = { path = "../geode-diagnostics" }
geode-guide = { path = "../geode-guide" }
geode-demo-data = { path = "../geode-demo-data" }
# Stamp publication arrival times, seed demo document dates from the configured
# clock, and format crash report timestamps.
chrono = "0.4.42"
# One-slot wakeup channel for the coalescing event mailbox. Producers use
# try_send; the foreground drain awaits notifications instead of polling.
async-channel = "2.5"
# Logging setup lives in geode-compose (`logging::install`); the app only
# emits records.
tracing.workspace = true
# The roster's restored-tile state is opaque `toml::Table` (the module
# hosting contract, geode-shell::module); the production-roster tests read
# a factory's launch state through it.
toml = "1.1.4"

[dev-dependencies]
# The demo tests build documents through the concrete kinds and check the
# dividend vocabulary and ids; the parsers themselves are registered by
# geode-compose.
geode-documents = { path = "../geode-documents" }
# Match workspace test features to reuse the same dependency artifacts.
geode-core = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"
# The bridge tests capture records through a scoped ring subscriber.
tracing-subscriber.workspace = true
# GPUI window tests and data handles without a running service.
gpui = { workspace = true, features = ["test-support"] }
geode-data = { path = "../geode-data", features = ["test-support"] }
# Inspect shell state after bridge delivery through production routes.
geode-shell = { path = "../geode-shell", features = ["test-support"] }
# `PricerTile::sheet()`/`is_loading()` (test-support-only accessors): the
# bridge's end-to-end tests read what a sheet load installed.
geode-pricer = { workspace = true, features = ["test-support"] }
