[package]
name = "geode-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "geode"
path = "src/main.rs"
bench = false

[features]
# Profiler support (spec §7.4), off by default — turns on geode-shell's
# same-named feature (which is gpui's own `profiler` feature; see that
# Cargo.toml's comment). Build with `cargo run -p geode-app --features
# profiling`; verified by `cargo check -p geode-app --features profiling`.
profiling = ["geode-shell/profiling"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
# Sibling pins — see the root Cargo.toml's dependency comment: gpui-component
# names these with a caret, and a direct `=` here is what keeps the family
# in step under `cargo update`. Not imported by this crate.
gpui-base.workspace = true
gpui-component-macros.workspace = true
geode-shell = { path = "../geode-shell" }
geode-core.workspace = true
# The data bridge (spec §5.1, src/bridge.rs) is the one place the shell
# and the data layer meet — it replaced the throwaway probe deleted in
# Phase 3c.
geode-data = { path = "../geode-data" }
# Every build has the mock pricer registered into the PricerRegistry
# beside the AdapterRegistry (line-pricer spec §5.5); a vendor crate,
# when one exists, registers itself behind its own feature gate.
geode-pricing.workspace = true
geode-blotter = { path = "../geode-blotter" }
# The market-data panel (market-data spec §8): one roster factory per
# panel spec, built beside the blotter's in `bridge::start` because it
# needs the same `DataHandle`.
geode-marketdata = { path = "../geode-marketdata" }
# The timeseries viewer (timeseries spec §9): one roster factory, built
# beside the blotter's and the panels' in `bridge::start` for the same
# reason — it asks for its series through the same `DataHandle`, and the
# reload handler needs a clone to hand it a reparsed `colours` doc.
geode-timeseries.workspace = true
# The line pricer (line-pricer spec §8): one roster factory, built beside
# the others in `bridge::start` because it needs the same `DataHandle`.
geode-pricer.workspace = true
geode-diagnostics = { path = "../geode-diagnostics" }
geode-demo-data = { path = "../geode-demo-data" }
# The demo bus (`src/demo_bus.rs`, market-data-documents plan Task 10)
# writes the CVI documents it generates onto a `ChannelAdapter` feed
# through the same `DocumentKind::write` door a real subscribed source's
# receiver thread reads through — `geode-app` is the one crate that
# registers document kinds into the data service (§6.4), so it is the
# one crate outside `geode-documents` itself that needs this dependency.
geode-documents = { path = "../geode-documents" }
# `demo_bus::run`'s cadence jitter — same version every other crate that
# draws randomness (`geode-demo-data`) already pins.
rand = "0.9"
# `DataEvent::Published` carries no timestamp of its own; the bridge
# stamps the arrival instant onto the `Publish` record a "recent
# publishes" preset needs (Phase 4a §3.12).
chrono = "0.4.42"
# The bridge's event channel (spec §5.1): bounded, `try_send`-only, and
# awaited on the foreground executor so the drain task wakes on arrival
# rather than polling.
async-channel = "2.5"
# Phase 4b Task 2: the tracing foundation, installed first thing in
# `main.rs` — stderr, ring and daily-file layers, `LogLevels` reload.
tracing.workspace = true
tracing-subscriber.workspace = true
# The daily rolling log file layer (`tracing_appender::rolling::daily`).
tracing-appender.workspace = true
# The roster's restored-tile state is opaque `toml::Table` (the module
# hosting contract, geode-shell::module) — `BlotterFactoryHandle::create`
# forwards it verbatim.
toml = "1.1.4"

[dev-dependencies]
# Test-feature parity (2026-09-19): `cargo test --workspace` resolves
# geode-core WITH `test-support` (geode-shell's dev-dependencies turn it
# on, and cargo unifies features across every member it builds together),
# so a `cargo test -p` of this crate alone must ask for the same thing or
# it builds a second geode-core — and everything above it — that differs
# only in that feature. One artifact per crate per profile is the rule;
# `cargo tree -p <member> -i geode-core --format '{p} [{f}]'` must agree
# with `cargo tree --workspace` for every member.
geode-core = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"
# `#[gpui::test]` / `TestAppContext` / `VisualTestContext` for the bridge's
# window-close drain-task test (`src/bridge.rs`), and `DataHandle::
# for_tests()` for a service-thread-free handle — same pattern as
# `geode-blotter`'s dev-dependencies re-declaring the same crates with
# `test-support` turned on.
gpui = { workspace = true, features = ["test-support"] }
geode-data = { path = "../geode-data", features = ["test-support"] }
# `ShellView::picker()` (test-support-only accessor, `geode-shell::shell`)
# — the bridge's own picker test needs to see a picker's `values` land
# without a `dispatch` call of its own to drive from.
geode-shell = { path = "../geode-shell", features = ["test-support"] }
# `PricerTile::sheet()`/`is_loading()` (test-support-only accessors): the
# bridge's end-to-end tests read what a sheet load installed.
geode-pricer = { workspace = true, features = ["test-support"] }
