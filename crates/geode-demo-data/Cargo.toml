[package]
name = "geode-demo-data"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rand = "0.9"
serde_json = "1.0.151"
# `documents::cvi::CviGenerator` produces `geode_core::document::
# DocumentRows` (market-data-documents plan, Task 10) — this crate never
# writes XML itself (`geode-documents` does that), so this is the only
# new dependency the generator needs. Layering rule: `geode-demo-data`
# depends on `geode-core` alone, never `geode-documents` or `geode-data`.
geode-core.workspace = true
chrono = "0.4.42"

[lib]
bench = false

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "generate"
harness = false

[[bench]]
name = "dividend"
harness = false

# Workspace invariant (CLAUDE.md): every target opts out of the built-in
# libtest harness so `cargo bench` runs criterion cleanly.
[[example]]
name = "emit"
bench = false
