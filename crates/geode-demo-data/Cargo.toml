[package]
name = "geode-demo-data"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rand = "0.9"
serde_json = "1.0.151"
# Document generators return core DocumentRows; XML serialization and source
# I/O belong to their callers. No dependency on geode-documents or geode-data.
# geode-pricing, a calculation leaf, prices the demo option chains.
geode-core.workspace = true
geode-pricing.workspace = true
chrono = "0.4.42"

[lib]
bench = false

[dev-dependencies]
# Match workspace test features so package-only tests reuse core artifacts.
geode-core = { workspace = true, features = ["test-support"] }
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "generate"
harness = false

[[bench]]
name = "dividend"
harness = false

# Only the Criterion targets participate in benchmark runs.
[[example]]
name = "emit"
bench = false
