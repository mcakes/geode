[package]
name = "geode-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Profiler support (spec §7.4), off by default: nothing but gpui's own
# `profiler` feature (hdrhistogram frame/input-latency histograms, the
# painted debug frame overlay, hang detection) plus the two shell actions
# that surface it (`perf::gpui_overlay`, `perf::dump` —
# `shell::profiling_hook`). No Tracy client: gpui at the pinned rev uses
# the backend-less `profiling` facade, and this workspace deliberately
# adds no backend dependency. Enable via geode-app's same-named feature.
profiling = ["gpui/profiler"]
# Exposes `module::recording`, the shell-hosting test double, outside this
# crate's own `#[cfg(test)]` — so Plan 3c's blotter tests can host a
# recorded neighbour without depending on geode-shell's dev-dependencies.
test-support = []

[dependencies]
geode-core.workspace = true
gpui.workspace = true
gpui-component.workspace = true
toml = "1.1.4"
serde_json = "1.0.151"
toml_edit = "0.25.13"
# Phase 4a (M6's earlier "test-only" note no longer holds): `Frame::
# note_published`'s `Publish::at`, `scopebar::build_model`'s "is the as-of
# date today" check (`chrono::Local::now()`), and the scope bar's as-of
# formatting are all runtime code now, not just `#[cfg(test)]` fixtures.
chrono = "0.4.42"
# Every migrated `eprintln!` site (Phase 4b Task 2) emits through this
# instead — `geode_core::log::LevelControl`/`Ring` own the subscriber
# machinery itself, so this crate only ever needs the emitting macros.
tracing.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
# The Snapshot fixture builder, so probe tests never name an Arrow type.
geode-core = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
criterion = "0.8.2"
# `open_module`'s no-matching-factory test scopes a real `RingLayer`
# subscriber to assert on the warning it logs (Phase 4b Task 5) — the same
# pattern `geode_core::log`'s own `RingLayer`/`MessageVisitor` tests use.
tracing-subscriber.workspace = true

# Criterion benches over the pure shell cores (spec §7.4). Kept in this
# crate rather than a dedicated bench crate: criterion is a dev-dependency
# only (zero cost to lib consumers), matching geode-demo-data's precedent.
# harness = false + the lib's bench = false are the workspace-wide criterion
# invariants (see CLAUDE.md).
[[bench]]
name = "shell_cores"
harness = false
