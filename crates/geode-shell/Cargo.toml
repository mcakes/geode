[package]
name = "geode-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Enable GPUI's frame/input-latency histograms, debug overlay, and hang
# detection, plus the shell actions that expose them. Off by default and
# enabled through geode-app's same-named feature. No profiling backend
# dependency is added; the pinned GPUI uses the backend-less facade.
profiling = ["gpui/profiler"]
# Expose the recording module for downstream hosting tests without
# requiring this crate's dev-dependencies.
test-support = []

[dependencies]
geode-core.workspace = true
gpui.workspace = true
gpui-component.workspace = true
# The scope bar's save icon comes from the shared asset catalog.
# geode-app embeds its bytes; this crate uses only the icon's path.
gpui-kit-assets.workspace = true
# For the as-of dialog's Custom row alone: `geode_shell::shell::asof_rows`
# seeds and reads a `geode_widgets::datefield::DateTimeField`, the same
# pure segmented-field core the market-data panel's header already uses.
geode-widgets.workspace = true
toml = "1.1.4"
serde_json = "1.0.151"
toml_edit = "0.25.13"
async-channel = "2.5"
# Runtime timestamps and date formatting for frame publishes and the
# scope bar. Local-time interpretation uses the configured clock.
chrono = "0.4.42"
# Logging macros; geode-core owns the subscriber and ring buffer.
tracing.workspace = true

[dev-dependencies]
# Match the test-support feature enabled by downstream hosting tests,
# so crate-only and workspace tests share the same feature configuration.
# The cfg gates use any(test, feature = "test-support") to avoid duplicate
# definitions when both are active.
geode-shell = { path = ".", features = ["test-support"] }
tempfile = "3.27.0"
# The Snapshot fixture builder, so probe tests never name an Arrow type.
geode-core = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
criterion = "0.8.2"
# Capture the warning from open_module when no factory matches.
tracing-subscriber.workspace = true

# Criterion benchmarks of shell core logic. Criterion is a dev-dependency;
# lib consumers do not compile it. Disable the default benchmark harness
# for both the library and these Criterion entry points.
[[bench]]
name = "shell_cores"
harness = false
