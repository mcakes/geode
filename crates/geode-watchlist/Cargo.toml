[package]
name = "geode-watchlist"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

# The watchlist model (`geode_core::watchlist`) lives in geode-core; the
# resolved lists arrive through `geode_shell::watchlist::WatchlistGlobal`,
# geode-shell supplies hosting and the config door, and geode-tile the
# header, menus and notices. The tile issues no data request, so it never
# depends on geode-data.
[dependencies]
geode-core.workspace = true
geode-shell.workspace = true
geode-tile.workspace = true
gpui.workspace = true
gpui-component.workspace = true
toml = "1.1.4"

[dev-dependencies]
geode-core = { workspace = true, features = ["test-support"] }
geode-shell = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
# Fixtures build a resolved list with its `resolved_at` instant.
chrono = "0.4.42"
