[package]
name = "geode-pricer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Read-only accessors a host's tests observe a tile through
# (`PricerTile::sheet`, `is_loading`); geode-app's dev-dependencies turn
# it on.
test-support = []

# The pure core (`core`) needs `geode-core` and `chrono` alone. The tile
# adds `geode-shell` for the module-hosting contract (`TileContent`,
# `Frame`, the keymap and action vocabulary, `ChoiceList`, the chip, colour,
# list-row and control doors), `geode-data` for `DataHandle` alone — the one
# door a module asks for data (pricing) through — `gpui`/`gpui-component`
# for the tile and its `DataTable`, `toml` for the session record,
# `tracing` for delivery diagnostics, and `geode-widgets` for
# the expiry's segmented date field (its pure core and painter). Never
# `geode-pricing`: a module reaches the pricer only through the data tier's
# request door (PHILOSOPHY §1, "In-process calculation"); never a sibling
# module.
[dependencies]
geode-core.workspace = true
geode-shell.workspace = true
geode-data = { path = "../geode-data" }
geode-widgets.workspace = true
gpui.workspace = true
gpui-component.workspace = true
chrono = "0.4.42"
toml = "1.1.4"
tracing.workspace = true

# Dev-dependencies ask for the same geode-* features `--workspace`
# resolves (test-feature parity, 2026-09-19), or this crate builds a
# private copy of the stack.
[dev-dependencies]
# A self dev-dependency (geode-shell's precedent) so `cargo test -p
# geode-pricer` builds this crate with the same features `--workspace`
# does.
geode-pricer = { path = ".", features = ["test-support"] }
geode-core = { workspace = true, features = ["test-support"] }
geode-shell = { workspace = true, features = ["test-support"] }
geode-data = { path = "../geode-data", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
criterion = "0.8.2"
# The storage round trip opens a real `DataService` on a temp directory.
tempfile = "3.27.0"

[[bench]]
name = "core"
harness = false
