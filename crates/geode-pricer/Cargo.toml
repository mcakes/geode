[package]
name = "geode-pricer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Read-only accessors a host's tests observe a tile through
# (`PricerTile::sheet`, `is_loading`, `entry_text`); geode-app's
# dev-dependencies turn it on.
test-support = []

# The core uses shared pricing vocabulary and calendar types; entry completion
# also uses the shell's pure filtering/completion helpers and GPUI SharedString.
# The tile uses shell hosting, the geode-tile doors, GPUI components, and the
# shared date field. Pricing and sheet persistence go through DataHandle,
# without a pricing implementation or sibling feature dependency.
[dependencies]
geode-core.workspace = true
geode-shell.workspace = true
geode-tile.workspace = true
geode-data = { path = "../geode-data" }
geode-widgets.workspace = true
gpui.workspace = true
gpui-component.workspace = true
chrono = "0.4.42"
toml = "1.1.4"
tracing.workspace = true

# Match the support features used by workspace tests to share dependency builds.
[dev-dependencies]
# Enable this crate's test accessors for package-local and workspace tests.
geode-pricer = { path = ".", features = ["test-support"] }
geode-core = { workspace = true, features = ["test-support"] }
geode-shell = { workspace = true, features = ["test-support"] }
geode-data = { path = "../geode-data", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
criterion = "0.8.2"
# The storage round trip opens a real `DataService` on a temp directory.
tempfile = "3.27.0"

[[bench]]
name = "core"
harness = false
