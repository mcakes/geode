[workspace]
resolver = "3"
members = [
    "crates/geode-core",
    "crates/geode-data",
    "crates/geode-shell",
    "crates/geode-widgets",
    "crates/geode-tile",
    "crates/geode-blotter",
    "crates/geode-marketdata",
    "crates/geode-chart",
    "crates/geode-timeseries",
    "crates/geode-volslice",
    "crates/geode-classifications",
    "crates/geode-diagnostics",
    "crates/geode-guide",
    "crates/geode-documents",
    "crates/geode-pricing",
    "crates/geode-pricer",
    "crates/geode-demo-data",
    "crates/geode-nemo",
    "crates/geode-positions",
    "crates/geode-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
geode-core = { path = "crates/geode-core" }
geode-shell = { path = "crates/geode-shell" }
geode-widgets = { path = "crates/geode-widgets" }
geode-nemo = { path = "crates/geode-nemo" }
geode-positions = { path = "crates/geode-positions" }
geode-data = { path = "crates/geode-data" }
geode-tile = { path = "crates/geode-tile" }
geode-pricing = { path = "crates/geode-pricing" }
geode-chart = { path = "crates/geode-chart" }
geode-timeseries = { path = "crates/geode-timeseries" }
geode-volslice = { path = "crates/geode-volslice" }
geode-classifications = { path = "crates/geode-classifications" }
geode-pricer = { path = "crates/geode-pricer" }

# Logging versions match gpui's resolved `tracing` family, avoiding a second
# copy. `tracing-appender` supplies the daily rolling file layer in
# `geode-app::main`.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "registry",
] }
tracing-appender = "0.2"

# GPUI and gpui-kit come from crates.io and every one of them is `=`-pinned.
#
# gpui-kit publishes weekly snapshots of zed's gpui crates as `gpui-pre`,
# `gpui-pre-platform` and `gpui-pre-macros` (each crate's description on
# crates.io names the zed rev it snapshots — 0.3.5 is zed@d89e9c2). gpui-kit
# itself depends on `gpui-pre` with a CARET, so an unpinned entry here would
# let a plain `cargo update` move gpui under us to a snapshot nobody has
# read. The `=` pins make this manifest and the committed Cargo.lock agree;
# a bump is a deliberate change on a branch, both families together.
#
# Geode and gpui-component name the same registry GPUI crate, keeping the
# types they exchange on one dependency identity.
#
# `gpui-pre-macros` rewrites `gpui::` paths inside macro output to
# `gpui_kit::` only when the calling crate depends on the `gpui-kit`
# umbrella. Geode never does — it aliases `gpui = { package = "gpui-pre" }`
# — so `#[gpui::test]` and every other macro path is unchanged.
gpui = { package = "gpui-pre", version = "=0.3.5" }
# runtime_shaders: compile Metal shaders at runtime; builds without full Xcode. No-op on non-macOS.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.5", features = ["font-kit", "runtime_shaders"] }
gpui-component = "=0.6.2"
# Renamed upstream from `gpui-component-assets` with the gpui-kit rebrand.
gpui-kit-assets = "=0.6.2"
# gpui-component names these siblings with caret requirements. geode-app
# depends on both solely to activate these exact pins: cargo update must
# not pair the component with a newer base or macro release whose API may
# be incompatible.
gpui-base = "=0.6.2"
gpui-component-macros = "=0.6.2"

# Release builds keep debug symbols so production-shaped benchmarks and
# regressions can be profiled.
[profile.release]
debug = true
lto = "thin"

[profile.bench]
debug = true
